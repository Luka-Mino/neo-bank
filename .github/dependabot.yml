version: 2
updates:
  # Weekly dependency scan + auto-PRs for security and version updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: hijacked versions are usually caught
    # and pulled within days. Security updates ignore this and arrive at once.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Batch dev-tooling bumps into one PR to cut noise.
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
